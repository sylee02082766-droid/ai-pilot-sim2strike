name: lm_cz_mixed_initial_smoke_from_l30b010_001
script: train_rllib

output:
  name: lm_hrl
  tag: cz_mixed_initial_smoke_from_l30b010_001

env:
  observation_mode: tactical16
  reward_module: student.lm_reward_cz
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  initial_scenario:
    mode: ref_old_random
    legacy_use_random_scenario: true
    legacy_use_first_scenario_only: false
    legacy_scenario_indices: [0, 1, 2, 3, 4, 5, 6, 7]
    legacy_randomization:
      aircraft_radius_m: 50.0
      roll_deg: 3.0
      pitch_deg: 3.0
      heading_deg: 3.0
      shared_n_m: 1500.0
      shared_e_m: 1500.0
      shared_d_m: 1500.0
      target_distance_n_m: 150.0
      speed_mps: 25.0
      loiter_bank_deg_range: [35.0, 60.0]
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    step_penalty: -0.001
    survival_bonus: 0.004
    adverse_angle_scale: 0.02
    track_angle_scale: 0.12
    relative_position_scale: 0.48
    closure_scale: 0.05
    gunsnap_blue_scale: 0.12
    gunsnap_red_scale: 1.00
    deck_scale: 4.20
    too_close_scale: 1.45
    track_lambda: 1.0
    blue_beta: 3.0
    red_beta: 3.0
    deck_altitude_ft: 6200.0
    deck_transition_ft: 1000.0
    damage_scale: 0.0
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 30.0
    pursuit_range_m: 3000.0
    low_altitude_penalty: 0.1
    altitude_hold_scale: 0.08
    altitude_target_m: 7000.0
    altitude_band_m: 5200.0
    safe_altitude_m: 4300.0
    low_altitude_guard_scale: 5.20
    attitude_penalty_scale: 0.16
    speed_target_kcas: 320.0
    speed_band_kcas: 220.0
    speed_penalty_scale: 0.08
    wez_band_scale: 0.0
    wez_hold_bonus: 0.0
    win_reward: 120.0
    loss_reward: -180.0
    draw_reward: -10.0
    own_crash_penalty: -520.0
    target_crash_reward: -8.0
    guard_fail_penalty: -120.0

algo:
  name: ppo
  framework: torch
  lr: 8.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.008
  explore: false
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true
    free_log_std: false
    log_std_clip_param: 2.0

runtime:
  iterations: 8
  init_bundle: artifacts/models/lm_hrl/cz_loiter30_noexplore_from_l20polish020_001/bundle_000010
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 4
  save_native_checkpoint: true
  native_checkpoint_frequency: 4

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 4
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 4
  steps: 600
  episodes: 1
  print: true

notes: "Mixed BT/loiter initial-scenario smoke using the release-provided ref_old_random scenario sampler. This tests opponent/initial-condition diversity before frozen self-play; updates are intentionally tiny so the best bank30 seed is not overwritten by one noisy opponent distribution."
