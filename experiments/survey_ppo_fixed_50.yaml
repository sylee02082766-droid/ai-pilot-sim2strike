name: survey_ppo_fixed_50
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_fixed_001

env:
  observation_mode: tactical16
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  reward:
    mode: default
    survival_bonus: 0.02
    step_penalty: -0.005
    damage_scale: 0.0
    pursuit_scale: 0.2
    pursuit_half_angle_deg: 60.0
    pursuit_range_m: 8000.0
    low_altitude_penalty: 1.0
    win_reward: 20.0
    loss_reward: -80.0
    draw_reward: 0.0

algo:
  name: ppo
  framework: torch
  lr: 3.0e-4
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.2
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 50
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10
  save_native_checkpoint: true
  native_checkpoint_frequency: 25

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 10
  steps: 600
  episodes: 1
  print: true

notes: "Survey PPO MLP warmup against a fixed target with the same reward scale as SAC."
