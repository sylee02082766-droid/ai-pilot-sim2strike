name: codex_ppo_bt_tailchase850_closure_slowtarget_from_762finish_b003_001
script: train_rllib

output:
  name: codex
  tag: ppo_bt_tailchase850_closure_slowtarget_from_762finish_b003_001

env:
  observation_mode: tactical16
  reward_module: student.my_reward_table1
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 35.0
  episode_step_limit: 2100

env_config:
  step_ratio: 6
  target_behavior_provider: true

  # Closure school after the 850/900 m same-speed attempts failed to kill.
  # The target is slightly slower so the policy can learn to close range from
  # the outer WEZ band before we restore equal-speed targets.
  ownship: [938.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [1788.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 260.0]
  ownship_randomization:
    enabled: true
    radius: 20.0
    r_roll: 1.0
    r_pitch: 1.0
    r_heading: 1.0

  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.20
    pitch_scale: 0.12
    pitch_max_abs: 0.20
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 2.60
      rudder_sign: -1.0
      roll_gain: 0.20
      roll_sign: 1.0
      pitch_gain: 0.18
      pitch_sign: -1.0
      az_ref_deg: 4.8
      el_ref_deg: 2.8
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 740.0
      deadband_m: 55.0
      far_ref_m: 300.0
      close_ref_m: 180.0
      close_gain: 1.20
      slow_gain: 0.08
    bank_turn_assist:
      enabled: true
      az_ref_deg: 8.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.08
      pull_gain: 0.035
    safety_filter:
      enabled: true
      low_alt_m: 6850.0
      min_alt_m: 6200.0
      high_alt_m: 8500.0
      high_alt_hard_m: 10500.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 14.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.05
      throttle_ceiling: 0.85
      roll_ref_deg: 45.0
      roll_hard_deg: 80.0
      roll_level_floor: 0.08
      roll_level_max: 0.32

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    step_penalty: -0.0005
    survival_bonus: 0.008
    adverse_angle_scale: 0.020
    track_angle_scale: 0.180
    relative_position_scale: 0.140
    closure_scale: 0.014
    gunsnap_blue_scale: 1.120
    gunsnap_red_scale: 0.060
    too_close_scale: 0.16
    track_lambda: 1.0
    blue_beta: 3.0
    red_beta: 3.0
    damage_scale: 860.0
    wez_band_scale: 3.20
    wez_band_center_m: 760.0
    wez_band_half_width_m: 240.0
    wez_nose_half_angle_deg: 2.0
    wez_hold_bonus: 78.00
    official_wez_aim_scale: 118.0
