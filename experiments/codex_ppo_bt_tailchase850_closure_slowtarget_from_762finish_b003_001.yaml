    deck_scale: 10.0
    deck_altitude_ft: 8500.0
    deck_transition_ft: 1800.0
    altitude_hold_scale: 1.00
    altitude_target_m: 7000.0
    altitude_band_m: 1800.0
    safe_altitude_m: 6650.0
    low_altitude_guard_scale: 40.0
    attitude_penalty_scale: 9.00
    attitude_envelope_guard_scale: 12.00
    pitch_envelope_ref_deg: 12.0
    roll_envelope_ref_deg: 38.0
    nose_down_guard_scale: 3.00
    nose_down_pitch_ref_deg: 18.0
    descent_rate_guard_scale: 3.00
    descent_rate_ref_mps: 70.0
    low_altitude_roll_guard_scale: 3.00
    roll_guard_ref_deg: 42.0
    action_pitch_down_guard_scale: 14.0
    action_pitch_guard_scale: 0.45
    action_roll_guard_scale: 4.0
    action_roll_global_guard_scale: 0.55
    action_guard_ref: 1.0
    speed_target_kcas: 330.0
    speed_band_kcas: 140.0
    speed_penalty_scale: 0.10
    pursuit_scale: 0.70
    pursuit_half_angle_deg: 45.0
    pursuit_range_m: 3000.0
    low_altitude_penalty: 0.1
    win_reward: 500.0
    loss_reward: -320.0
    draw_reward: -150.0
    own_crash_penalty: -1400.0
    target_crash_reward: 0.0
    guard_fail_penalty: -260.0

algo:
  name: ppo
  framework: torch
  explore: false
  lr: 1.5e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.005
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 9
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 3
  save_native_checkpoint: true
  native_checkpoint_frequency: 6
  init_bundle: artifacts/models/codex/best_tailchase762_finish_hold_001/bundle_000003

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 3
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 3
  steps: 550
  episodes: 5
  print: true

notes: "Codex 850 m closure school. Same-speed 800/850/900 m attempts opened WEZ but did not close enough for damage. This run slows the BT target to 260 m/s, raises close throttle assist, and rewards closure/damage so the policy can learn to move from outer WEZ into the stronger damage band."
