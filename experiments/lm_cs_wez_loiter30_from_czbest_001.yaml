name: lm_cs_wez_loiter30_from_czbest_001
script: train_rllib

output:
  name: lm_hrl
  tag: cs_wez_loiter30_from_czbest_001

env:
  observation_mode: tactical16
  reward_module: student.lm_reward_cs
  target_mode: loiter
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  target_loiter:
    enabled: true
    bank: 30.0
    pitch: 0.0
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    step_penalty: -0.001
    survival_bonus: 0.003
    adverse_angle_scale: 0.02
    track_angle_scale: 0.16
    relative_position_scale: 0.45
    closure_scale: 0.04
    gunsnap_blue_scale: 0.45
    gunsnap_red_scale: 1.05
    wez_band_scale: 0.35
    wez_band_center_m: 520.0
    wez_band_half_width_m: 390.0
    wez_nose_half_angle_deg: 8.0
    wez_hold_bonus: 0.015
    deck_scale: 4.30
    too_close_scale: 1.55
    track_lambda: 1.0
    blue_beta: 3.0
    red_beta: 3.0
    deck_altitude_ft: 6200.0
    deck_transition_ft: 1000.0
    damage_scale: 0.0
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 30.0
    pursuit_range_m: 3000.0
    low_altitude_penalty: 0.1
    altitude_hold_scale: 0.08
    altitude_target_m: 7000.0
    altitude_band_m: 5200.0
    safe_altitude_m: 4300.0
    low_altitude_guard_scale: 5.20
    attitude_penalty_scale: 0.16
    speed_target_kcas: 320.0
    speed_band_kcas: 220.0
    speed_penalty_scale: 0.08
    win_reward: 140.0
    loss_reward: -190.0
    draw_reward: -12.0
    own_crash_penalty: -540.0
    target_crash_reward: -8.0
    guard_fail_penalty: -130.0

algo:
  name: ppo
  framework: torch
  lr: 8.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.008
  explore: false
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true
    free_log_std: false
    log_std_clip_param: 2.0

runtime:
  iterations: 12
  init_bundle: artifacts/models/lm_hrl/cz_loiter30_noexplore_from_l20polish020_001/bundle_000010
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 4
  save_native_checkpoint: true
  native_checkpoint_frequency: 4

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 4
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 4
  steps: 600
  episodes: 1
  print: true

notes: "First CS/WEZ shooting-school smoke. Start from the current CZ best and train against loiter bank30 with WEZ-band and blue-gunsnap shaping enabled. No-explore keeps the stable CZ action mode while testing whether WEZ steps can appear without collapsing flight stability."
