name: codex_pp_true_close500
script: train_rllib

output:
  name: codex
  tag: ppo_t26_bt914_reacquire_040

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 90.0
  episode_step_limit: 5400

env_config:
  step_ratio: 6
  ownship: [2600.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [3514.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 280.0]
  ownship_randomization:
    enabled: true
    radius: 100.0
    r_roll: 4.0
    r_pitch: 4.0
    r_heading: 6.0

  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 10.2
      rudder_sign: -1.0
      roll_gain: 0.75
      roll_sign: 1.0
      pitch_gain: 0.52
      pitch_sign: -1.0
      az_ref_deg: 1.3
      el_ref_deg: 1.1
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 220.0
      close_gain: 5.00
      slow_gain: 0.14
    bank_turn_assist:
      enabled: true
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.11
      pull_gain: 0.045
    safety_filter:
      enabled: true
      low_alt_m: 6850.0
      min_alt_m: 6200.0
      high_alt_m: 9500.0
      high_alt_hard_m: 11500.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    allow_external_override: 1.0
    mode: t26_bt914_reacquire
    maneuver_progress_scale: 10.0
    maneuver_position_weight: 0.60
    maneuver_track_weight: 0.40
    combat_gate_center_m: 2200.0
    combat_gate_width_m: 600.0
    closure_control_penalty_per_s: 1.40
    closure_reference_mps: 80.0
    desired_closure_gain_per_s: 0.08
    desired_closure_max_mps: 80.0
    desired_opening_max_mps: 40.0
    hold_range_fraction: 0.50
    too_close_penalty_per_s: 2.00
    too_close_margin_m: 150.0
    too_close_width_m: 80.0
    precision_aim_penalty_per_s: 0.70
    precision_log_reference_deg: 1.0
    precision_log_max_deg: 60.0
    precision_bridge_angle_deg: 5.0
    pre_wez_bridge_m: 450.0
    pre_wez_bridge_fraction: 0.60
    pre_wez_closure_ref_mps: 80.0
    wez_solution_reward_per_s: 8.0
    wez_solution_sigma_deg: 2.0
    damage_scale: 80.0
    time_penalty_per_s: 0.03
    win_reward: 250.0
    target_evasion_reward: 0.0
    loss_reward: -250.0
    draw_reward: -100.0
    own_crash_penalty: -500.0
    target_deck_reward: 0.0
    guard_fail_penalty: -200.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    safety_envelope_start_m: 5000.0
    safety_envelope_rate_per_s: 4.0
    stable_flight_reward_per_s: 0.0
    altitude_hold_reward_per_s: 0.0
    survival_reward_per_s: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 3.0e-5
  gamma: 0.997
  train_batch_size: 8192
  minibatch_size: 512
  gae_lambda: 0.95
  clip_param: 0.08
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 40
  num_env_runners: 2
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  init_bundle: artifacts/models/codex/tactical26_seed_yaw10_20260814

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 5
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 5
  steps: 900
  episodes: 1
  print: true

notes: "First verified continuation after fixing init-bundle learner sync. Keeps the tactical16 actor behavior, appends ten zero-initialized motion features, and learns 914m BT reacquisition/WEZ hold without accepting target-evasion as a kill substitute."
