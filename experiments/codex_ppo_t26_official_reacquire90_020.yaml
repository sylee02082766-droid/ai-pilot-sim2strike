name: codex_ppo_t26_official_reacquire90_020
script: train_rllib

output:
  name: codex
  tag: ppo_t26_official_reacquire90_020

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: loiter
  max_engage_time: 60.0
  episode_step_limit: 600
  min_altitude: 300.0

env_config:
  step_ratio: 6
  initial_scenario:
    mode: two_circle_headon
    alpha_deg: 0.0
    turn_diameter_ft: 6000.0
    separation_jitter_ft: [2000.0, 3000.0]
    center_n_m: 3500.0
    center_e_m: 0.0
    altitude_m_range: [610.0, 9144.0]
    speed_mps_range: [200.0, 300.0]
    vertical_pitch_choices_deg: [-3.0, 0.0, 3.0]
    roll_range_deg: [-5.0, 5.0]
    side_choices: [-1.0, 1.0]
  ownship_randomization: {enabled: false}
  target_loiter: {enabled: true, bank: 0.0, pitch: 0.0}
  range_discipline:
    enabled: true
    max_range_m: 8000.0
    grow_steps: 30
  reacquire_curriculum:
    enabled: true
    merge_distance_m: 950.0
    departure_ata_deg: 100.0
    success_ata_deg: 90.0
    success_min_range_m: 0.0
    success_range_m: 5000.0
    sustain_steps: 5

  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      max_ata_deg: 25.0
      rudder_gain: 10.2
      rudder_sign: -1.0
      roll_gain: 0.75
      roll_sign: 1.0
      pitch_gain: 0.52
      pitch_sign: -1.0
      az_ref_deg: 1.3
      el_ref_deg: 1.1
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 220.0
      close_gain: 10.0
      slow_gain: 0.14
      disable_close_above_ata_deg: 10.0
    closure_assist:
      enabled: true
      min_distance_m: 0.0
      target_m: 700.0
      deadband_m: 50.0
      desired_gain_per_s: 0.05
      max_closure_mps: 180.0
      max_opening_mps: 30.0
      error_ref_mps: 80.0
      throttle_gain: 2.0
    bank_turn_assist:
      enabled: true
      max_ata_deg: 25.0
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.11
      pull_gain: 0.045
    merge_break_assist:
      enabled: true
      max_ata_deg: 45.0
      min_aa_deg: 130.0
      max_distance_m: 2200.0
      turn_sign: 1.0
      roll_command: 0.78
      pull_command: 0.52
      rudder_fraction: 0.08
      roll_max_abs: 0.90
      pitch_max_abs: 0.78
    pursuit_turn_assist:
      enabled: true
      min_ata_deg: 25.0
      full_ata_deg: 110.0
      rear_cone_deg: 120.0
      lock_turn_above_ata_deg: 90.0
      default_turn_sign: 1.0
      roll_sign: 1.0
      roll_command: 0.72
      pull_command: 0.78
      blend: 0.55
      rudder_fraction: 0.10
      throttle_command: -0.2
      throttle_mode: blend
      roll_max_abs: 0.90
      pitch_max_abs: 0.78
    safety_filter:
      enabled: true
      low_alt_m: 900.0
      min_alt_m: 300.0
      high_alt_m: 12000.0
      high_alt_hard_m: 14000.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32
      high_ata_threshold_deg: 25.0
      high_ata_roll_ref_deg: 65.0
      high_ata_roll_hard_deg: 90.0
    phase_latch:
      enabled: true
      trigger_min_aa_deg: 120.0
      overlay:
        range_assist:
          disable_close_above_ata_deg: 10.0
        pursuit_turn_assist:
          throttle_command: -0.2
          throttle_mode: blend
        closure_assist:
          min_distance_m: 0.0
          throttle_gain: 2.0

  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    allow_external_override: 1.0
    mode: official_reacquire90
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 30.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    combat_gate_center_m: 5000.0
    combat_gate_width_m: 1000.0
    closure_control_penalty_per_s: 1.25
    too_close_penalty_per_s: 3.0
    precision_aim_penalty_per_s: 0.4
    enemy_lock_penalty_per_s: 1.5
    wez_solution_reward_per_s: 2.0
    damage_scale: 60.0
    time_penalty_per_s: 0.05
    mutual_headon_penalty_per_s: 3.0
    mutual_headon_sigma_deg: 25.0
    mutual_headon_range_m: 3200.0
    mutual_headon_range_width_m: 600.0
    post_threat_opening_penalty_per_s: 8.0
    post_threat_opening_start_m: 1600.0
    post_threat_opening_width_m: 400.0
    safety_envelope_start_m: 900.0
    safety_envelope_rate_per_s: 5.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 300.0
    target_evasion_reward: 0.0
    loss_reward: -400.0
    draw_reward: -180.0
    own_crash_penalty: -600.0
    target_deck_reward: 0.0
    curriculum_success_reward: 350.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 3.0e-5
  gamma: 0.997
  train_batch_size: 4096
  minibatch_size: 512
  gae_lambda: 0.95
  clip_param: 0.10
  entropy_coeff: 0.002
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 20
  num_env_runners: 2
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 2
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  dashboard_logdir: artifacts/dashboard
  policy_probe_interval: 5
  policy_probe_steps: 4

init:
  init_bundle: artifacts/models/codex/champion/ppo26_phase_v1

log:
  notes: "Official-envelope stage 0: turn back within ATA 90 deg after a 2000-3000 ft head-on merge."
