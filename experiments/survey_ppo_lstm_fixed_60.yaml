name: survey_ppo_lstm_fixed_60
script: train_rllib

output:
  name: survey
  tag: ppo_lstm_fixed_001

env:
  observation_mode: tactical16
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    mode: default
    survival_bonus: 0.02
    step_penalty: -0.005
    damage_scale: 0.0
    pursuit_scale: 0.2
    pursuit_half_angle_deg: 60.0
    pursuit_range_m: 8000.0
    low_altitude_penalty: 1.0
    win_reward: 20.0
    loss_reward: -80.0
    draw_reward: 0.0

algo:
  name: ppo
  framework: torch
  lr: 1.0e-4
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.12
  lstm:
    enabled: true
    cell_size: 64
    max_seq_len: 8
    debug_io: false
  mlp:
    enabled: true
    fcnet_hiddens: [128, 128]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 60
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: 8
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 20
  save_native_checkpoint: true
  native_checkpoint_frequency: 20

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 20
  steps: 600
  episodes: 1
  print: true

notes: "First PPO LSTM stability track against a fixed target. This is a fresh recurrent baseline, not a continuation from the MLP entry_b040 policy."
