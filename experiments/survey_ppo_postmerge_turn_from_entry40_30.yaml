name: survey_ppo_postmerge_turn_from_entry40_30
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_postmerge_turn_entry40_001

env:
  observation_mode: tactical16
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.my_reward_postmerge_turn
  max_engage_time: 120.0
  episode_step_limit: 7200

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    step_penalty: -0.002
    survival_bonus: 0.002
    pursuit_scale: 0.22
    pursuit_half_angle_deg: 50.0
    pursuit_range_m: 7000.0
    turn_band_scale: 0.18
    turn_band_min_m: 700.0
    turn_band_max_m: 2200.0
    turn_half_angle_deg: 35.0
    tight_nose_bonus: 0.04
    tight_nose_angle_deg: 8.0
    too_close_penalty: 0.12
    damage_scale: 35.0
    altitude_target_m: 7000.0
    altitude_band_m: 5500.0
    safe_altitude_m: 2800.0
    low_altitude_penalty: 1.8
    attitude_penalty_scale: 0.018
    win_reward: 160.0
    loss_reward: -190.0
    draw_reward: -10.0
    own_crash_penalty: -260.0
    target_crash_reward: -8.0

algo:
  name: ppo
  framework: torch
  lr: 5.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.03
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 30
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  restore_checkpoint: artifacts/checkpoints/survey/ppo_mlp_dogfight_entry_stage80_001/checkpoint_000040

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 10
  steps: 1200
  episodes: 1
  print: true

notes: "Gentle post-merge turn continuation from entry_b040. Goal: improve nose alignment in the 700-2200 m band without repeating the too-aggressive WEZ-band crash."
