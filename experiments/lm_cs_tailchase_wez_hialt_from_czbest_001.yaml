name: lm_cs_tailchase_wez_hialt_from_czbest_001
script: train_rllib

output:
  name: lm_hrl
  tag: cs_tailchase_wez_hialt_from_czbest_001

env:
  observation_mode: tactical16
  reward_module: student.lm_reward_cs
  target_mode: autopilot
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  ownship: [1000.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 300.0]
  target: [1700.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 250.0]
  target_autopilot:
    heading_cmd: 0.0
    altitude_cmd: 9000.0
    speed_cmd: 250.0
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    step_penalty: -0.001
    survival_bonus: 0.002
    adverse_angle_scale: 0.03
    track_angle_scale: 0.24
    relative_position_scale: 0.25
    closure_scale: 0.02
    gunsnap_blue_scale: 2.00
    gunsnap_red_scale: 0.80
    wez_band_scale: 5.00
    wez_band_center_m: 560.0
    wez_band_half_width_m: 430.0
    wez_nose_half_angle_deg: 6.0
    wez_hold_bonus: 2.50
    deck_scale: 3.00
    too_close_scale: 0.80
    track_lambda: 1.0
    blue_beta: 3.0
    red_beta: 3.0
    deck_altitude_ft: 5200.0
    deck_transition_ft: 900.0
    damage_scale: 0.0
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 30.0
    pursuit_range_m: 3000.0
    low_altitude_penalty: 0.1
    altitude_hold_scale: 0.06
    altitude_target_m: 9000.0
    altitude_band_m: 5200.0
    safe_altitude_m: 5000.0
    low_altitude_guard_scale: 3.00
    attitude_penalty_scale: 0.08
    speed_target_kcas: 300.0
    speed_band_kcas: 180.0
    speed_penalty_scale: 0.05
    win_reward: 180.0
    loss_reward: -210.0
    draw_reward: -4.0
    own_crash_penalty: -420.0
    target_crash_reward: -60.0
    guard_fail_penalty: -100.0

algo:
  name: ppo
  framework: torch
  lr: 7.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.008
  explore: false
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true
    free_log_std: false
    log_std_clip_param: 2.0

runtime:
  iterations: 8
  init_bundle: artifacts/models/lm_hrl/cz_loiter30_noexplore_from_l20polish020_001/bundle_000010
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 4
  save_native_checkpoint: true
  native_checkpoint_frequency: 4

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 4
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 4
  steps: 600
  episodes: 1
  print: true

notes: "High-altitude CS tail-chase WEZ smoke. Keeps Blue behind Red but raises both aircraft to 9000 m, reduces too-close pressure, and penalizes target hard-deck endings so the policy preserves official WEZ hold instead of learning a dive-ending shortcut."
