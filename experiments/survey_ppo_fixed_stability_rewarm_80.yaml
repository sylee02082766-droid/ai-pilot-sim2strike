name: survey_ppo_fixed_stability_rewarm_80
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_fixed_stability_rewarm_001

env:
  observation_mode: tactical16
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.my_reward_stability
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    survival_bonus: 0.02
    step_penalty: -0.005
    damage_scale: 5.0
    pursuit_scale: 0.12
    pursuit_half_angle_deg: 60.0
    pursuit_range_m: 8000.0
    altitude_target_m: 7000.0
    altitude_band_m: 3500.0
    safe_altitude_m: 3000.0
    low_altitude_penalty: 1.8
    roll_penalty_scale: 0.05
    pitch_penalty_scale: 0.05
    speed_target_kcas: 300.0
    speed_band_kcas: 180.0
    speed_penalty_scale: 0.03
    win_reward: 80.0
    loss_reward: -120.0
    draw_reward: 5.0
    crash_penalty: -180.0
    guard_fail_penalty: -80.0

algo:
  name: ppo
  framework: torch
  lr: 1.0e-4
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.16
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 80
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 20
  save_native_checkpoint: true
  native_checkpoint_frequency: 40
  init_bundle: artifacts/models/survey/ppo_mlp_fixed_001/bundle_000050

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 20
  steps: 600
  episodes: 1
  print: true

notes: "PPO fixed-target rewarmup with stability reward from the stable fixed bundle. Goal: recover altitude-safe control before returning to BT."
