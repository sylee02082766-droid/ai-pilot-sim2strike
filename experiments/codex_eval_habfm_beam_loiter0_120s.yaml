name: codex_eval_habfm_beam_loiter0_120s
script: train_rllib

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: loiter
  max_engage_time: 120.0
  episode_step_limit: 1201
  min_altitude: 300.0

env_config:
  step_ratio: 6
  initial_scenario:
    mode: two_circle_headon
    alpha_deg: 90.0
    turn_diameter_ft: 0.0
    separation_jitter_ft: [3000.0, 3000.0]
    center_n_m: 3500.0
    center_e_m: 0.0
    altitude_m_range: [4572.0, 4572.0]
    speed_mps_range: [250.0, 250.0]
    vertical_pitch_choices_deg: [0.0]
    roll_range_deg: [0.0, 0.0]
    side_choices: [-1.0, 1.0]
  ownship_randomization: {enabled: false}
  target_loiter: {enabled: true, bank: 0.0, pitch: 0.0}
  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    allow_external_override: 1.0
    target_evasion_reward: 0.0
    target_deck_reward: 0.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0

algo: {name: ppo, framework: torch, explore: false}
runtime: {iterations: 1, num_env_runners: 1, num_envs_per_env_runner: 1}
dashboard: {enabled: false}
policy_probe: {enabled: false}
engagement_log: {enabled: false}

notes: "Evaluation only. Level straight target at the 3000 ft beam start."
