name: survey_ppo_dogfight_entry_from_jitter6_40
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_dogfight_entry_jitter6_001

env:
  observation_mode: tactical16
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 100.0
  episode_step_limit: 6000

env_config:
  step_ratio: 6
  ownship_randomization:
    enabled: true
    radius: 150.0
    r_roll: 2.0
    r_pitch: 2.0
    r_heading: 2.0
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    mode: default
    survival_bonus: 0.004
    step_penalty: -0.002
    damage_scale: 16.0
    pursuit_scale: 0.34
    pursuit_half_angle_deg: 70.0
    pursuit_range_m: 8500.0
    low_altitude_penalty: 2.4
    win_reward: 150.0
    loss_reward: -180.0
    draw_reward: -10.0

algo:
  name: ppo
  framework: torch
  lr: 1.5e-6
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.05
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 40
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10
  save_native_checkpoint: true
  native_checkpoint_frequency: 20
  restore_checkpoint: artifacts/checkpoints/survey/ppo_mlp_bt_final_mild_jitter_smoke_001/checkpoint_000006

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 10
  steps: 1000
  episodes: 1
  print: true

notes: "Optional dogfight entry from the mild-jitter smoke checkpoint 6. Use this only if random-start robustness becomes more important than preserving the exact closest fixed-start approach."
