name: survey_ppo_bt_restore_loiter_ckpt_60
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_bt_restore_loiter_ckpt_001

env:
  observation_mode: tactical16
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    mode: default
    survival_bonus: 0.006
    step_penalty: -0.002
    damage_scale: 12.0
    pursuit_scale: 0.35
    pursuit_half_angle_deg: 70.0
    pursuit_range_m: 9000.0
    low_altitude_penalty: 1.2
    win_reward: 120.0
    loss_reward: -140.0
    draw_reward: -10.0

algo:
  name: ppo
  framework: torch
  lr: 1.0e-5
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.10
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 60
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 20
  save_native_checkpoint: true
  native_checkpoint_frequency: 30
  restore_checkpoint: artifacts/checkpoints/survey/ppo_mlp_loiter_default_from_fixed_001/checkpoint_000100

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 20
  steps: 600
  episodes: 1
  print: true

notes: "Short BT adaptation restored from the native loiter checkpoint instead of the lightweight bundle, to preserve PPO state."
