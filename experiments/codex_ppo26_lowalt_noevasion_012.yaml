name: codex_ppo26_lowalt_noevasion_012
script: train_rllib

output:
  name: codex
  tag: ppo26_lowalt_noevasion_012

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: loiter
  max_engage_time: 120.0
  episode_step_limit: 1200
  min_altitude: 300.0

env_config:
  step_ratio: 6
  initial_scenario:
    mode: two_circle_headon
    alpha_deg: 0.0
    turn_diameter_ft: 6000.0
    separation_jitter_ft: [2000.0, 3000.0]
    center_n_m: 3500.0
    center_e_m: 0.0
    altitude_m_range: [610.0, 2500.0]
    speed_mps_range: [200.0, 300.0]
    vertical_pitch_choices_deg: [0.0]
    roll_range_deg: [0.0, 0.0]
    side_choices: [-1.0, 1.0]
  ownship_randomization: {enabled: false}
  target_loiter: {enabled: true, bank: 30.0, pitch: 0.0}

  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 10.2
      rudder_sign: -1.0
      roll_gain: 0.75
      roll_sign: 1.0
      pitch_gain: 0.52
      pitch_sign: -1.0
      az_ref_deg: 1.3
      el_ref_deg: 1.1
      deadband_deg: 0.0
      max_ata_deg: 25.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 220.0
      close_gain: 10.0
      slow_gain: 0.14
    closure_assist:
      enabled: true
      min_distance_m: 1500.0
      target_m: 700.0
      deadband_m: 50.0
      desired_gain_per_s: 0.05
      max_closure_mps: 180.0
      max_opening_mps: 30.0
      error_ref_mps: 80.0
      throttle_gain: 2.0
    bank_turn_assist:
      enabled: true
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.11
      pull_gain: 0.045
      max_ata_deg: 25.0
    merge_break_assist:
      enabled: true
      max_ata_deg: 45.0
      min_aa_deg: 130.0
      max_distance_m: 2200.0
      turn_sign: 1.0
      roll_command: 0.78
      pull_command: 0.52
      rudder_fraction: 0.08
      roll_max_abs: 0.90
      pitch_max_abs: 0.78
    pursuit_turn_assist:
      enabled: true
      min_ata_deg: 25.0
      full_ata_deg: 110.0
      rear_cone_deg: 120.0
      lock_turn_above_ata_deg: 90.0
      default_turn_sign: 1.0
      roll_sign: 1.0
      roll_command: 0.72
      pull_command: 0.78
      blend: 0.55
      rudder_fraction: 0.10
      throttle_command: 1.0
      throttle_mode: floor
      roll_max_abs: 0.90
      pitch_max_abs: 0.78
    safety_filter:
      enabled: true
      low_alt_m: 900.0
      min_alt_m: 300.0
      high_alt_m: 12000.0
      high_alt_hard_m: 14000.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32
      high_ata_threshold_deg: 25.0
      high_ata_roll_ref_deg: 65.0
      high_ata_roll_hard_deg: 90.0
    phase_latch:
      enabled: true
      trigger_min_aa_deg: 120.0
      overlay:
        range_assist:
          disable_close_above_ata_deg: 10.0
        pursuit_turn_assist:
          throttle_command: -0.2
          throttle_mode: blend
          hold_bank_deg: 75.0
          bank_error_gain: 0.035
          roll_command: 0.80
          pull_command: 0.60
          blend: 1.0
        closure_assist:
          min_distance_m: 0.0
          throttle_gain: 2.0
        safety_filter:
          roll_level_disable_above_ata_deg: 25.0
          high_ata_pitch_threshold_deg: 25.0
          high_ata_pitch_up_ref_deg: 25.0
          emergency_deck_m: 1200.0
          emergency_roll_command: 0.80
          emergency_pitch_command: 0.75
          emergency_throttle_command: 0.50

  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    allow_external_override: 1.0
    safety_envelope_start_m: 1200.0
    safety_envelope_rate_per_s: 2.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    target_evasion_reward: 0.0
    target_deck_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 5.0e-6
  gamma: 0.997
  train_batch_size: 4096
  minibatch_size: 256
  gae_lambda: 0.95
  clip_param: 0.05
  entropy_coeff: 0.0005
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 12
  num_env_runners: 2
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 2
  save_native_checkpoint: true
  native_checkpoint_frequency: 6
  dashboard_logdir: artifacts/dashboard
  policy_probe_interval: 2
  policy_probe_steps: 4
  init_bundle: artifacts/models/codex/champion/ppo26_competition_v2_b4

log:
  notes: "Low-altitude curriculum from champion v2. Official 2000-ft-compatible envelope; only actual damage/destruction counts."
