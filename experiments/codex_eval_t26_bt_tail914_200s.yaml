name: codex_eval_t26_bt_tail914_200s
script: train_rllib

output:
  name: eval
  tag: t26_bt_tail914_200s

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 200.0
  episode_step_limit: 12000

env_config:
  step_ratio: 6
  ownship: [2600.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [3514.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 280.0]
  ownship_randomization:
    enabled: true
    radius: 60.0
    r_roll: 2.0
    r_pitch: 2.0
    r_heading: 2.0

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    allow_external_override: 1.0
    win_reward: 250.0
    target_evasion_reward: 40.0
    loss_reward: -250.0
    draw_reward: -80.0

algo:
  name: ppo
  framework: torch
  explore: false
  lr: 1.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 1
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes

dashboard:
  enabled: false

policy_probe:
  enabled: false

engagement_log:
  enabled: false

notes: "Evaluation-only official max-distance tail-chase, 200s round time."
