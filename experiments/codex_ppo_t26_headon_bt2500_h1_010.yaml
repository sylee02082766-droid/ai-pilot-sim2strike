name: codex_ppo_t26_headon_bt2500_h1_010
script: train_rllib

output:
  name: codex
  tag: ppo_t26_headon_bt2500_h1_010

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  ownship: [2250.0, 0.0, -8000.0, 0.0, 0.0, 0.0, 285.0]
  target: [4750.0, 0.0, -8000.0, 0.0, 0.0, 180.0, 285.0]
  ownship_randomization:
    enabled: true
    radius: 80.0
    r_roll: 3.0
    r_pitch: 2.0
    r_heading: 3.0

  action_postprocess:
    roll_scale: 0.20
    roll_max_abs: 0.75
    pitch_scale: 0.20
    pitch_max_abs: 0.55
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 4.0
      rudder_sign: -1.0
      roll_gain: 0.35
      roll_sign: 1.0
      pitch_gain: 0.25
      pitch_sign: -1.0
      az_ref_deg: 5.0
      el_ref_deg: 4.0
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 1000.0
      close_ref_m: 220.0
      close_gain: 1.2
      slow_gain: 0.18
    bank_turn_assist:
      enabled: true
      az_ref_deg: 20.0
      deadband_deg: 2.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.08
      pull_gain: 0.04
    safety_filter:
      enabled: true
      low_alt_m: 6500.0
      min_alt_m: 4500.0
      high_alt_m: 10500.0
      high_alt_hard_m: 12500.0
      pitch_down_ref_deg: 12.0
      pitch_up_ref_deg: 20.0
      pitch_up_floor: 0.02
      pitch_up_max: 0.08
      pitch_down_floor: 0.03
      pitch_down_max: 0.12
      throttle_floor: 0.10
      throttle_ceiling: 0.80
      roll_ref_deg: 70.0
      roll_hard_deg: 105.0
      roll_level_floor: 0.04
      roll_level_max: 0.18

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    allow_external_override: 1.0
    mode: headon_bt2500_h1
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 20.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    combat_gate_center_m: 5000.0
    combat_gate_width_m: 1000.0
    closure_control_penalty_per_s: 0.70
    too_close_penalty_per_s: 2.0
    precision_aim_penalty_per_s: 0.40
    enemy_lock_penalty_per_s: 1.0
    wez_solution_reward_per_s: 5.0
    damage_scale: 80.0
    time_penalty_per_s: 0.03
    mutual_headon_penalty_per_s: 4.0
    mutual_headon_sigma_deg: 25.0
    mutual_headon_range_m: 3200.0
    mutual_headon_range_width_m: 600.0
    safety_envelope_start_m: 5000.0
    safety_envelope_rate_per_s: 3.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 300.0
    target_evasion_reward: 0.0
    loss_reward: -300.0
    draw_reward: -120.0
    own_crash_penalty: -500.0
    target_deck_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 2.0e-5
  gamma: 0.997
  train_batch_size: 2048
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.08
  entropy_coeff: 0.002
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 10
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 1
  save_native_checkpoint: true
  native_checkpoint_frequency: 5
  init_bundle: artifacts/models/codex/postprocess26/true_close1000

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 1
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 2
  steps: 600
  episodes: 1
  print: true

notes: "Head-on BT school. Full 26D actor learns a break and reacquisition at 2.5 km before official 610-914 m stages."
