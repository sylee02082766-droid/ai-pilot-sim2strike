name: codex_ppo_t26_pybt3_mix_wez8_stage3_020
script: train_rllib

output:
  name: codex
  tag: ppo_t26_pybt3_mix_wez8_stage3_020

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: autopilot
  max_engage_time: 120.0
  episode_step_limit: 1200

env_config:
  step_ratio: 6
  action_slew_limit: 0.25
  ownship: [0.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 260.0]
  target: [700.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 250.0]
  ownship_randomization:
    enabled: false
  offensive_saddle:
    enabled: true
    range_m: [500.0, 900.0]
    aspect_deg: [0.0, 25.0]
    altitude_m: 7000.0
    target_speed_mps: 250.0
    own_speed_mps: 260.0
  range_discipline:
    enabled: true
    max_range_m: 3500.0
    grow_steps: 30
  altitude_discipline:
    enabled: true
    floor_m: 1200.0
    sustain_steps: 5

  # 75% reactive opponent, 25% easier random jinker as an anti-collapse anchor.
  target_bt:
    enabled: true
    prob: 0.75
    max_turn_rate_deg_s: 3.0
    max_climb_rate_mps: 40.0
    min_altitude_m: 3000.0
    max_altitude_m: 11000.0
    threat_range_m: 1500.0
    threat_rear_deg: 90.0
    threat_track_deg: 40.0
    evade_enabled: true
    break_angle_deg: 100.0
    jink_min_steps: 25
    jink_max_steps: 70
    evade_vertical_m: 500.0
    lead_time_s: 3.0
    speed_attack_mps: 260.0
    speed_evade_mps: 270.0
    speed_max_mps: 290.0
    command_lead_max_deg: 45.0
    mode_min_steps: 20
  target_weave:
    enabled: true
    random_jink: true
    hdg_rate_min_deg: 2.0
    hdg_rate_max_deg: 10.0
    vert_rate_min_m: 4.0
    vert_rate_max_m: 20.0
    switch_min_steps: 20
    switch_max_steps: 90
    vertical_dev_max_m: 1200.0
    straight_prob: 0.1
  target_autopilot:
    heading_cmd: 0.0
    altitude_cmd: -7000.0
    speed_cmd: 250.0

  # Keep the proven controller for this bootstrap. It will be faded after kills stabilize.
  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 10.2
      rudder_sign: -1.0
      roll_gain: 0.75
      roll_sign: 1.0
      pitch_gain: 0.52
      pitch_sign: -1.0
      az_ref_deg: 1.3
      el_ref_deg: 1.1
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 220.0
      close_gain: 10.0
      slow_gain: 0.14
    bank_turn_assist:
      enabled: true
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.11
      pull_gain: 0.045
    safety_filter:
      enabled: true
      low_alt_m: 5500.0
      min_alt_m: 4500.0
      high_alt_m: 9500.0
      high_alt_hard_m: 11500.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32

  # Curriculum only. Held-out evaluation always restores the official 2-degree cone.
  wez:
    angle_deg: 8.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    allow_external_override: 1.0
    mode: pybt3_mix_wez8_stage3
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 8.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    combat_gate_center_m: 2200.0
    combat_gate_width_m: 500.0
    closure_control_penalty_per_s: 1.25
    too_close_penalty_per_s: 1.50
    precision_aim_penalty_per_s: 0.80
    enemy_lock_penalty_per_s: 1.00
    wez_solution_reward_per_s: 4.0
    damage_scale: 30.0
    time_penalty_per_s: 0.03
    mutual_headon_penalty_per_s: 0.75
    post_threat_opening_penalty_per_s: 1.0
    safety_envelope_start_m: 5000.0
    safety_envelope_rate_per_s: 3.0
    survival_reward_per_s: 0.002
    stable_flight_reward_per_s: 0.01
    altitude_hold_target_m: 7000.0
    altitude_hold_band_m: 1000.0
    altitude_hold_reward_per_s: 0.005
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 250.0
    target_evasion_reward: 0.0
    loss_reward: -250.0
    draw_reward: -100.0
    own_crash_penalty: -500.0
    target_deck_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 3.0e-5
  gamma: 0.997
  train_batch_size: 8192
  minibatch_size: 512
  gae_lambda: 0.95
  clip_param: 0.08
  entropy_coeff: 0.001
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 20
  num_env_runners: 2
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  init_bundle: artifacts/models/codex/postprocess26/true_close1000

dashboard:
  enabled: true
  logdir: artifacts/dashboard
policy_probe:
  enabled: true
  interval: 5
  steps: 4
  print: true
engagement_log:
  enabled: true
  interval: 5
  steps: 1200
  episodes: 1
  print: true

notes: "PPO bootstrap adapted from the team's proven Python-BT ladder: 75% BT turn3 + 25% random jink, widened 8-degree training cone, held-out official cone remains 2 degrees."
