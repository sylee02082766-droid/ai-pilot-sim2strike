name: survey_ppo_bt_guarded_from_stage80_60
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_bt_guarded_from_stage80_001

env:
  observation_mode: tactical16
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  reward_module: student.my_reward_guarded_attack
  max_engage_time: 120.0
  episode_step_limit: 7200

env_config:
  step_ratio: 6
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

algo:
  name: ppo
  framework: torch
  lr: 5.0e-6
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.07
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 60
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 20
  save_native_checkpoint: true
  native_checkpoint_frequency: 20
  restore_checkpoint: artifacts/checkpoints/survey/ppo_mlp_bt_restore_stage80_001/checkpoint_000080

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 20
  steps: 1000
  episodes: 1
  print: true

notes: "Guarded-attack continuation from the current best stage80 native checkpoint. Tests whether discouraging target self-crash and strongly penalizing ownship altitude failure improves BT dogfight robustness."
