name: codex_ppo_t26_postmerge_bt1000_h4_reacquire_040
script: train_rllib

output:
  name: codex
  tag: ppo_t26_postmerge_bt1000_h4_reacquire_040

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.codex_reward_reacquire
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 40.0
  episode_step_limit: 2400

env_config:
  step_ratio: 6
  # Blue has just passed Red: Red is 1 km behind, both initially northbound.
  ownship: [4000.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 285.0]
  target: [3000.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 250.0]
  ownship_randomization:
    enabled: true
    radius: 50.0
    r_roll: 2.0
    r_pitch: 2.0
    r_heading: 3.0

  action_postprocess:
    roll_scale: 0.30
    roll_max_abs: 0.70
    pitch_scale: 0.30
    pitch_max_abs: 0.70
    pitch_bias: 0.0
    rudder_scale: 0.40
    rudder_max_abs: 0.60
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      max_ata_deg: 15.0
      rudder_gain: 2.5
      rudder_sign: -1.0
      roll_gain: 0.30
      roll_sign: 1.0
      pitch_gain: 0.22
      pitch_sign: -1.0
      az_ref_deg: 3.0
      el_ref_deg: 2.5
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 500.0
      close_ref_m: 220.0
      close_gain: 1.5
      slow_gain: 0.18
      disable_close_above_ata_deg: 45.0
    bank_turn_assist:
      enabled: true
      az_ref_deg: 25.0
      deadband_deg: 2.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.14
      pull_gain: 0.08
    safety_filter:
      enabled: true
      low_alt_m: 7500.0
      min_alt_m: 6000.0
      high_alt_m: 11000.0
      high_alt_hard_m: 13000.0
      pitch_down_ref_deg: 10.0
      pitch_up_ref_deg: 18.0
      pitch_up_floor: 0.04
      pitch_up_max: 0.12
      pitch_down_floor: 0.05
      pitch_down_max: 0.18
      throttle_floor: 0.12
      throttle_ceiling: 0.75
      roll_ref_deg: 65.0
      roll_hard_deg: 95.0
      roll_level_floor: 0.05
      roll_level_max: 0.22

  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    allow_external_override: 1.0
    mode: postmerge_bt1000_h4_reacquire
    maneuver_progress_scale: 3.0
    combat_gate_center_m: 1000.0
    combat_gate_width_m: 300.0
    closure_control_penalty_per_s: 0.4
    post_threat_opening_penalty_per_s: 0.3
    mutual_headon_penalty_per_s: 0.0
    precision_aim_penalty_per_s: 0.3
    enemy_lock_penalty_per_s: 1.0
    wez_solution_reward_per_s: 4.0
    damage_scale: 60.0
    safety_envelope_start_m: 7500.0
    safety_envelope_rate_per_s: 5.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 250.0
    target_evasion_reward: 0.0
    loss_reward: -300.0
    draw_reward: -80.0
    own_crash_penalty: -600.0
    target_deck_reward: 0.0
    reacquire_merge_distance_m: 1200.0
    reacquire_activation_ata_deg: 60.0
    reacquire_success_ata_deg: 20.0
    reacquire_potential_scale: 120.0
    reacquire_opening_penalty_per_s: 4.0
    reacquire_closure_reward_per_s: 3.0
    reacquire_success_bonus: 120.0
    reacquire_step_penalty_per_s: 0.08

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 2.0e-5
  gamma: 0.997
  train_batch_size: 4096
  minibatch_size: 256
  gae_lambda: 0.95
  clip_param: 0.08
  entropy_coeff: 0.001
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 40
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 2
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  init_bundle: artifacts/models/codex/postprocess26/true_close1000

dashboard: {enabled: true, logdir: artifacts/dashboard}
policy_probe: {enabled: true, interval: 2, steps: 4, print: true}
engagement_log: {enabled: true, interval: 5, steps: 400, episodes: 1, print: true}

notes: "Post-merge school: 1 km target-behind start, moderate controls, high-altitude safety margin, and stateful reacquisition shaping."
