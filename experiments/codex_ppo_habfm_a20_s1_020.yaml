name: codex_ppo_habfm_a20_s1_020
script: train_rllib

output:
  name: codex
  tag: ppo_habfm_a20_s1_020

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.codex_reward_beam_capture
  target_mode: fixed
  max_engage_time: 30.0
  episode_step_limit: 300
  min_altitude: 300.0

env_config:
  step_ratio: 6
  initial_scenario:
    mode: two_circle_headon
    alpha_deg: 20.0
    turn_diameter_ft: 0.0
    separation_jitter_ft: [2800.0, 3200.0]
    center_n_m: 3500.0
    center_e_m: 0.0
    altitude_m_range: [4000.0, 5200.0]
    speed_mps_range: [235.0, 265.0]
    vertical_pitch_choices_deg: [0.0]
    roll_range_deg: [-2.0, 2.0]
    side_choices: [-1.0, 1.0]
  ownship_randomization: {enabled: false}

  action_postprocess:
    roll_scale: 0.65
    roll_max_abs: 0.90
    pitch_scale: 0.65
    pitch_max_abs: 0.85
    pitch_bias: 0.0
    rudder_scale: 0.50
    rudder_max_abs: 0.70
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      max_ata_deg: 20.0
      rudder_gain: 3.0
      rudder_sign: -1.0
      roll_gain: 0.35
      roll_sign: 1.0
      pitch_gain: 0.25
      pitch_sign: -1.0
      az_ref_deg: 3.0
      el_ref_deg: 2.5
      deadband_deg: 0.0
    range_assist: {enabled: false}
    closure_assist: {enabled: false}
    bank_turn_assist: {enabled: false}
    merge_break_assist: {enabled: false}
    pursuit_turn_assist: {enabled: false}
    safety_filter:
      enabled: true
      low_alt_m: 1200.0
      min_alt_m: 300.0
      high_alt_m: 10000.0
      high_alt_hard_m: 13000.0
      pitch_down_ref_deg: 12.0
      pitch_up_ref_deg: 25.0
      pitch_up_floor: 0.05
      pitch_up_max: 0.35
      pitch_down_floor: 0.05
      pitch_down_max: 0.25
      throttle_floor: 0.30
      throttle_ceiling: 1.0
      roll_ref_deg: 80.0
      roll_hard_deg: 115.0
      roll_level_floor: 0.05
      roll_level_max: 0.20
      roll_level_disable_above_ata_deg: 25.0

  wez: {angle_deg: 2.0, min_range_m: 152.4, max_range_m: 914.4}
  reward:
    allow_external_override: 1.0
    mode: habfm_beam_fixed_s1
    table1_step_scale: 0.0
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 0.0
    closure_control_penalty_per_s: 0.25
    too_close_penalty_per_s: 1.0
    precision_aim_penalty_per_s: 0.0
    enemy_lock_penalty_per_s: 1.0
    wez_solution_reward_per_s: 0.0
    damage_scale: 0.0
    time_penalty_per_s: 0.02
    mutual_headon_penalty_per_s: 0.0
    post_threat_opening_penalty_per_s: 2.0
    post_threat_opening_start_m: 1800.0
    post_threat_opening_width_m: 500.0
    safety_envelope_start_m: 2200.0
    safety_envelope_rate_per_s: 4.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 0.0
    target_evasion_reward: 0.0
    loss_reward: -250.0
    draw_reward: 0.0
    own_crash_penalty: -500.0
    target_deck_reward: 0.0
    beam_progress_scale: 140.0
    beam_own_aim_weight: 0.65
    beam_target_tail_weight: 0.35
    beam_hold_reward_per_s: 1.5
    beam_success_own_ata_deg: 25.0
    beam_success_target_ata_deg: 120.0
    beam_success_max_range_m: 2500.0
    beam_success_bonus: 60.0
    beam_wrong_way_penalty_per_s: 2.0
    beam_wrong_way_start_deg: 100.0
    beam_runaway_start_m: 1800.0
    beam_runaway_width_m: 2200.0
    beam_runaway_penalty_per_s: 3.0

algo:
  name: ppo
  framework: torch
  explore: false
  lr: 1.0e-5
  gamma: 0.995
  train_batch_size: 4096
  minibatch_size: 256
  gae_lambda: 0.95
  clip_param: 0.08
  entropy_coeff: 0.0
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 20
  num_env_runners: 2
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 4
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  dashboard_logdir: artifacts/dashboard
  policy_probe_interval: 4
  policy_probe_steps: 4
  init_bundle: artifacts/models/codex/ppo26_official_random_noexplore_012/bundle_000012

log:
  notes: "HABFM acquisition curriculum stage alpha20. Deterministic PPO first learns the post-merge turn before alpha40/60/90."
