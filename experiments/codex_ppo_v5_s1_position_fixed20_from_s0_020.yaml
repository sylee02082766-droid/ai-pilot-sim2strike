name: codex_ppo_v5_s1_position_fixed20_from_s0_020
script: train_rllib

output:
  name: codex
  tag: ppo_v5_s1_position_fixed20_from_s0_020

env:
  observation_mode: tactical16
  reward_module: student.v5_my_reward
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 20.0
  episode_step_limit: 1200

env_config:
  step_ratio: 6

  ownship: [1000.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [1700.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]

  action_postprocess:
    roll_scale: 0.35
    roll_max_abs: 0.40
    pitch_scale: 0.85
    pitch_max_abs: 0.85
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    mode: v5_s1_position
    allow_external_override: 1.0

    # Stage 1: add position/nose advantage. Still no official shot/damage.
    table1_step_scale: 0.10
    relative_position_weight: 0.30
    closure_weight: 0.0
    track_advantage_weight: 0.20
    too_close_weight: 0.0
    maneuver_progress_scale: 2.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    blue_beta: 0.0
    red_beta_magnitude: 0.0
    precision_aim_penalty_per_s: 0.0
    enemy_lock_penalty_per_s: 0.0
    damage_scale: 0.0
    evasion_warning_penalty_per_s: 0.0

    time_penalty_per_s: 0.02
    combat_gate_center_m: 1800.0
    combat_gate_width_m: 450.0
    safety_envelope_start_m: 1800.0
    safety_envelope_rate_per_s: 2.0
    safe_descent_mps: 25.0
    safe_nose_down_deg: 15.0
    safe_roll_deg: 85.0

    win_reward: 0.0
    loss_reward: -100.0
    draw_reward: 0.0
    own_crash_penalty: -320.0
    target_deck_reward: 0.0
    guard_fail_penalty: -120.0
    range_discipline_penalty: 0.0
    curriculum_success_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 1.0e-6
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.006
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 20
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10
  save_native_checkpoint: true
  native_checkpoint_frequency: 20
  init_bundle: artifacts/models/codex/ppo_v5_s0_attitude_fixed20_010/bundle_000010

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 10
  steps: 400
  episodes: 1
  print: true

notes: "V5 staged curriculum s1. Fixed target. Adds position and nose-alignment advantage after s0 safety."
