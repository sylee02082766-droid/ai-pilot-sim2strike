name: codex_ppo_v6_s4_full_bt_from_s3_020
script: train_rllib

output:
  name: codex
  tag: ppo_v6_s4_full_bt_from_s3_020

env:
  observation_mode: tactical16
  reward_module: student.v6_ppo_my_reward
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 45.0
  episode_step_limit: 2700

env_config:
  step_ratio: 6
  target_behavior_provider: true

  ownship: [938.0, 0.0, -8000.0, 0.0, 0.0, 0.0, 300.0]
  target: [2138.0, 0.0, -8000.0, 0.0, 0.0, 0.0, 260.0]
  ownship_randomization:
    enabled: true
    radius: 35.0
    r_roll: 1.5
    r_pitch: 1.5
    r_heading: 1.5

  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 4.2
      rudder_sign: -1.0
      roll_gain: 0.50
      roll_sign: 1.0
      pitch_gain: 0.28
      pitch_sign: -1.0
      az_ref_deg: 3.2
      el_ref_deg: 2.4
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 760.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 200.0
      close_gain: 1.25
      slow_gain: 0.16
    bank_turn_assist:
      enabled: true
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.12
      pull_gain: 0.05
    safety_filter:
      enabled: true
      low_alt_m: 6850.0
      min_alt_m: 6200.0
      high_alt_m: 9500.0
      high_alt_hard_m: 11500.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    mode: v6_s4_full_bt_damage50_evasion_terminal
    allow_external_override: 1.0

    # Stage 4 ON: all terms, damage=50, evasion 15+15 s, terminal.
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 8.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    shooter_track_lambda: 0.4444444444
    blue_beta: 3.0
    red_beta_magnitude: 3.0
    combat_gate_center_m: 2200.0
    combat_gate_width_m: 500.0
    closure_control_penalty_per_s: 1.25
    closure_reference_mps: 80.0
    desired_closure_gain_per_s: 0.08
    desired_closure_max_mps: 80.0
    desired_opening_max_mps: 45.0
    hold_range_fraction: 0.50
    too_close_penalty_per_s: 1.50
    too_close_margin_m: 100.0
    too_close_width_m: 50.0

    precision_aim_penalty_per_s: 0.80
    precision_log_reference_deg: 1.0
    precision_log_max_deg: 60.0
    enemy_lock_penalty_per_s: 1.00
    precision_bridge_angle_deg: 3.0
    enemy_threat_sigma_deg: 3.0
    pre_wez_bridge_m: 220.0
    pre_wez_bridge_fraction: 0.30
    pre_wez_closure_ref_mps: 80.0
    wez_solution_reward_per_s: 4.0
    wez_solution_sigma_deg: 1.5
    align_gunsnap_with_damage: 1.0
    damage_scale: 50.0

    defensive_threat_sigma_deg: 20.0
    defensive_threat_range_m: 1800.0
    defensive_threat_range_width_m: 450.0
    post_threat_opening_penalty_per_s: 1.00
    post_threat_opening_start_m: 2200.0
    post_threat_opening_width_m: 500.0
    mutual_headon_penalty_per_s: 0.75
    mutual_headon_sigma_deg: 20.0
    mutual_headon_range_m: 2500.0
    mutual_headon_range_width_m: 500.0

    evasion_detection_s: 15.0
    evasion_warning_s: 15.0
    evasion_warning_penalty_per_s: 2.0
    evasion_away_cone_deg: 30.0
    evasion_pursuit_cone_deg: 60.0
    time_penalty_per_s: 0.03

    safety_envelope_start_m: 5000.0
    safety_envelope_rate_per_s: 3.0
    safe_descent_mps: 25.0
    safe_nose_down_deg: 10.0
    safe_roll_deg: 65.0
    hard_deck_m: 300.0

    survival_reward_per_s: 0.0
    stable_flight_reward_per_s: 0.0
    altitude_hold_target_m: 0.0
    altitude_hold_reward_per_s: 0.0
    altitude_error_penalty_per_s: 0.0
    attitude_delta_penalty_scale: 0.0
    control_magnitude_penalty_scale: 0.0
    control_delta_penalty_scale: 0.0

    win_reward: 250.0
    loss_reward: -250.0
    draw_reward: -100.0
    own_crash_penalty: -400.0
    target_deck_reward: 100.0
    guard_fail_penalty: -180.0
    range_discipline_penalty: -180.0
    curriculum_success_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 2.0e-7
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.0025
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 20
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 10
  save_native_checkpoint: true
  native_checkpoint_frequency: 20
  init_bundle: artifacts/models/codex/ppo_v6_s3_wez_loiter_from_s2_020/bundle_000020

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 10
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 10
  steps: 500
  episodes: 1
  print: true

notes: "V6 stage 4. Full reward with damage=50, updated 15+15 s evasion rule, and terminal rewards against BT target."
