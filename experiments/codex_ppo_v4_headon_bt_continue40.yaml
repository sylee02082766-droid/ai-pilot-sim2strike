name: codex_ppo_v4_headon_bt_continue40
script: train_rllib

output:
  name: codex
  tag: ppo_v4_headon_bt_continue40

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: behavior_tree
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 60.0
  episode_step_limit: 3600

env_config:
  step_ratio: 6
  ownship: [2250.0, 0.0, -8000.0, 0.0, 0.0, 0.0, 285.0]
  target: [4750.0, 0.0, -8000.0, 0.0, 0.0, 180.0, 285.0]
  ownship_randomization:
    enabled: true
    radius: 80.0
    r_roll: 3.0
    r_pitch: 2.0
    r_heading: 3.0

  # Exact action postprocess from the verified true_close1000 candidate.
  action_postprocess:
    roll_scale: 0.12
    roll_max_abs: 0.45
    pitch_scale: 0.12
    pitch_max_abs: 0.26
    pitch_bias: 0.0
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0
    los_assist:
      enabled: true
      rudder_gain: 10.2
      rudder_sign: -1.0
      roll_gain: 0.75
      roll_sign: 1.0
      pitch_gain: 0.52
      pitch_sign: -1.0
      az_ref_deg: 1.3
      el_ref_deg: 1.1
      deadband_deg: 0.0
    range_assist:
      enabled: true
      target_m: 700.0
      deadband_m: 40.0
      far_ref_m: 320.0
      close_ref_m: 220.0
      close_gain: 10.0
      slow_gain: 0.14
    bank_turn_assist:
      enabled: true
      az_ref_deg: 10.0
      deadband_deg: 1.0
      disable_ata_deg: 0.0
      disable_in_wez: false
      roll_sign: -1.0
      roll_gain: 0.11
      pull_gain: 0.045
    safety_filter:
      enabled: true
      low_alt_m: 6850.0
      min_alt_m: 6200.0
      high_alt_m: 9500.0
      high_alt_hard_m: 11500.0
      pitch_down_ref_deg: 8.0
      pitch_up_ref_deg: 16.0
      pitch_up_floor: 0.03
      pitch_up_max: 0.10
      pitch_down_floor: 0.04
      pitch_down_max: 0.16
      throttle_floor: 0.10
      throttle_ceiling: 0.70
      roll_ref_deg: 45.0
      roll_hard_deg: 85.0
      roll_level_floor: 0.08
      roll_level_max: 0.32

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    allow_external_override: 1.0
    mode: headon_bt2500_h2_close10
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    track_advantage_weight: 0.0
    maneuver_progress_scale: 12.0
    maneuver_position_weight: 0.65
    maneuver_track_weight: 0.35
    combat_gate_center_m: 5000.0
    combat_gate_width_m: 1000.0
    closure_control_penalty_per_s: 1.0
    too_close_penalty_per_s: 1.5
    precision_aim_penalty_per_s: 0.65
    enemy_lock_penalty_per_s: 1.0
    wez_solution_reward_per_s: 6.0
    damage_scale: 100.0
    time_penalty_per_s: 0.03
    mutual_headon_penalty_per_s: 2.0
    mutual_headon_sigma_deg: 25.0
    mutual_headon_range_m: 3200.0
    mutual_headon_range_width_m: 600.0
    post_threat_opening_penalty_per_s: 3.0
    post_threat_opening_start_m: 1600.0
    post_threat_opening_width_m: 400.0
    safety_envelope_start_m: 6000.0
    safety_envelope_rate_per_s: 4.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    win_reward: 300.0
    target_evasion_reward: 0.0
    loss_reward: -300.0
    draw_reward: -120.0
    own_crash_penalty: -500.0
    target_deck_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 5.0e-6
  gamma: 0.997
  train_batch_size: 2048
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.02
  entropy_coeff: 0.0005
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 40
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 2
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  init_bundle: artifacts/models/codex/champion/ppo26_competition_v4_composed

dashboard:
  enabled: true
  logdir: artifacts/dashboard
policy_probe:
  enabled: true
  interval: 1
  steps: 4
  print: true
engagement_log:
  enabled: true
  interval: 3
  steps: 600
  episodes: 1
  print: true

notes: "Forty-iteration head-on BT continuation from frozen champion V4. Accept only if both head-on signal and held-out official regression improve."
