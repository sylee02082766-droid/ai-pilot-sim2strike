name: survey_ppo_loiter_long_from_loiter_best_140
script: train_rllib

output:
  name: survey
  tag: ppo_mlp_loiter_long_from_loiter_best_001

env:
  observation_mode: tactical16
  target_mode: loiter
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 120.0
  episode_step_limit: 7200

env_config:
  step_ratio: 6
  target_loiter:
    enabled: true
    bank: 25.0
    pitch: 0.0
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    mode: default
    survival_bonus: 0.010
    step_penalty: -0.0025
    damage_scale: 8.0
    pursuit_scale: 0.32
    pursuit_half_angle_deg: 70.0
    pursuit_range_m: 9000.0
    low_altitude_penalty: 1.2
    win_reward: 100.0
    loss_reward: -120.0
    draw_reward: -6.0

algo:
  name: ppo
  framework: torch
  lr: 4.0e-5
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.14
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 140
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 20
  save_native_checkpoint: true
  native_checkpoint_frequency: 70
  init_bundle: artifacts/models/survey/ppo_mlp_loiter_default_from_fixed_001/bundle_000100

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 20
  steps: 4
  print: true

engagement_log:
  enabled: false
  interval: 20
  steps: 1200
  episodes: 1
  print: true

notes: "Lengthen the best loiter-default policy to 120-second episodes before returning to harder BT opponents."
