name: codex_eval_t26_straight_headon2500_speed190_60s
script: train_rllib

output:
  name: codex
  tag: eval_t26_pybt3_headon2500_60s

env:
  observation_mode: custom
  observation_module: student.codex_tactical26
  reward_module: student.v6_ppo_my_reward
  target_mode: autopilot
  max_engage_time: 60.0
  episode_step_limit: 600

env_config:
  step_ratio: 6
  ownship: [2250.0, 0.0, -8000.0, 0.0, 0.0, 0.0, 285.0]
  target: [4750.0, 0.0, -8000.0, 0.0, 0.0, 180.0, 285.0]
  ownship_randomization:
    enabled: true
    radius: 80.0
    r_roll: 3.0
    r_pitch: 2.0
    r_heading: 3.0
  target_autopilot:
    heading_cmd: 180.0
    altitude_cmd: -8000.0
    speed_cmd: 190.0
  target_bt:
    enabled: true
    prob: 0.0
    max_turn_rate_deg_s: 3.0
    max_climb_rate_mps: 35.0
    min_altitude_m: 3000.0
    max_altitude_m: 12000.0
    threat_range_m: 1000.0
    threat_rear_deg: 110.0
    threat_track_deg: 25.0
    evade_enabled: true
    break_angle_deg: 90.0
    jink_min_steps: 25
    jink_max_steps: 70
    evade_vertical_m: 500.0
    lead_time_s: 3.0
    speed_attack_mps: 280.0
    speed_evade_mps: 260.0
    speed_max_mps: 290.0
    command_lead_max_deg: 45.0
    mode_min_steps: 15
    evade_max_steps: 60
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    allow_external_override: 1.0
    target_evasion_reward: 0.0
    evasion_detection_s: 9999.0
    evasion_warning_s: 9999.0
    evasion_warning_penalty_per_s: 0.0
    target_deck_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: false
  lr: 1.0e-7
  gamma: 0.997
  train_batch_size: 2048
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.003
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 1
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes

dashboard:
  enabled: false
policy_probe:
  enabled: false
engagement_log:
  enabled: false

notes: "Straight autopilot A/B check with speed command matched to the measured initial JSBSim speed."
