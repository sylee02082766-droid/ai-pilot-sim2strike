name: codex_ppo_v5_s0_attitude_fixed20_010
script: train_rllib

output:
  name: codex
  tag: ppo_v5_s0_attitude_fixed20_010

env:
  observation_mode: tactical16
  reward_module: student.v5_my_reward
  target_mode: fixed
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 20.0
  episode_step_limit: 1200

env_config:
  step_ratio: 6

  ownship: [1000.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]
  target: [1700.0, 0.0, -7000.0, 0.0, 0.0, 0.0, 300.0]

  action_postprocess:
    roll_scale: 0.35
    roll_max_abs: 0.40
    pitch_scale: 0.85
    pitch_max_abs: 0.85
    rudder_scale: 1.0
    rudder_max_abs: 1.0
    throttle_scale: 1.0
    throttle_max_abs: 1.0

  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4

  reward:
    mode: v5_s0_attitude_only
    allow_external_override: 1.0

    # Stage 0: do not teach attack yet. Keep only time, safety, and crash loss.
    table1_step_scale: 0.10
    relative_position_weight: 0.0
    closure_weight: 0.0
    track_advantage_weight: 0.0
    too_close_weight: 0.0
    maneuver_progress_scale: 0.0
    blue_beta: 0.0
    red_beta_magnitude: 0.0
    precision_aim_penalty_per_s: 0.0
    enemy_lock_penalty_per_s: 0.0
    damage_scale: 0.0
    evasion_warning_penalty_per_s: 0.0

    time_penalty_per_s: 0.01
    hard_deck_m: 300.0
    deck_warning_offset_m: 91.44
    deck_transition_m: 6.096
    safety_envelope_start_m: 1800.0
    safety_envelope_rate_per_s: 2.5
    safe_descent_mps: 25.0
    descent_span_mps: 75.0
    safe_nose_down_deg: 12.0
    nose_down_span_deg: 45.0
    safe_roll_deg: 75.0
    roll_span_deg: 90.0

    win_reward: 0.0
    loss_reward: -80.0
    draw_reward: 0.0
    own_crash_penalty: -300.0
    target_deck_reward: 0.0
    guard_fail_penalty: -100.0
    range_discipline_penalty: 0.0
    curriculum_success_reward: 0.0

algo:
  name: ppo
  framework: torch
  explore: true
  lr: 2.0e-6
  gamma: 0.99
  train_batch_size: 1024
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.010
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true

runtime:
  iterations: 10
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 5
  save_native_checkpoint: true
  native_checkpoint_frequency: 10
  init_bundle: artifacts/models/table1/ppo_fixed20_shooting_school_from_stabilityb040_001/bundle_000040

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 5
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 5
  steps: 400
  episodes: 1
  print: true

notes: "V5 staged curriculum s0. Fixed target, attack reward disabled. Purpose: verify v5 imports and preserve attitude/altitude safety before adding tactical terms."
