name: lm_cs_tailchase_paper_cs_slow20_probe_001
script: train_rllib

output:
  name: lm_hrl
  tag: cs_tailchase_paper_cs_slow20_probe_001

env:
  observation_mode: tactical16
  reward_module: student.lm_reward_cs
  target_mode: autopilot
  target_behavior_dll: AIP_BASE_target.dll
  max_engage_time: 20.0
  episode_step_limit: 1200

env_config:
  step_ratio: 6
  ownship: [1000.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 270.0]
  target: [1700.0, 0.0, -9000.0, 0.0, 0.0, 0.0, 250.0]
  target_autopilot:
    heading_cmd: 0.0
    altitude_cmd: 9000.0
    speed_cmd: 250.0
  wez:
    angle_deg: 2.0
    min_range_m: 152.4
    max_range_m: 914.4
  reward:
    step_penalty: -0.001
    survival_bonus: 0.002
    adverse_angle_scale: 0.0
    track_angle_scale: 0.70
    relative_position_scale: 0.0
    closure_scale: 0.0
    gunsnap_blue_scale: 4.00
    gunsnap_red_scale: 1.20
    wez_band_scale: 1.20
    wez_band_center_m: 560.0
    wez_band_half_width_m: 430.0
    wez_nose_half_angle_deg: 4.0
    wez_hold_bonus: 6.00
    deck_scale: 3.00
    too_close_scale: 0.0
    track_lambda: 1.0
    blue_beta: 3.0
    red_beta: 3.0
    deck_altitude_ft: 5200.0
    deck_transition_ft: 900.0
    damage_scale: 80.0
    pursuit_scale: 0.0
    pursuit_half_angle_deg: 30.0
    pursuit_range_m: 3000.0
    low_altitude_penalty: 0.1
    altitude_hold_scale: 0.03
    altitude_target_m: 9000.0
    altitude_band_m: 5200.0
    safe_altitude_m: 5000.0
    low_altitude_guard_scale: 3.00
    attitude_penalty_scale: 0.04
    speed_target_kcas: 270.0
    speed_band_kcas: 220.0
    speed_penalty_scale: 0.02
    win_reward: 180.0
    loss_reward: -210.0
    draw_reward: -1.0
    own_crash_penalty: -420.0
    target_crash_reward: -100.0
    guard_fail_penalty: -100.0

algo:
  name: ppo
  framework: torch
  lr: 5.0e-7
  gamma: 0.99
  train_batch_size: 2048
  minibatch_size: 128
  gae_lambda: 0.95
  clip_param: 0.006
  explore: true
  mlp:
    enabled: true
    fcnet_hiddens: [256, 256]
    fcnet_activation: relu
    head_fcnet_hiddens: []
    head_fcnet_activation: relu
    vf_share_layers: true
    free_log_std: false
    log_std_clip_param: 2.0

runtime:
  iterations: 4
  init_bundle: artifacts/models/lm_hrl/cz_loiter30_noexplore_from_l20polish020_001/bundle_000010
  num_env_runners: 1
  num_envs_per_env_runner: 1
  rollout_fragment_length: auto
  batch_mode: truncate_episodes
  save_lightweight_bundle: true
  lightweight_bundle_frequency: 4
  save_native_checkpoint: true
  native_checkpoint_frequency: 4

dashboard:
  enabled: true
  logdir: artifacts/dashboard

policy_probe:
  enabled: true
  interval: 4
  steps: 4
  print: true

engagement_log:
  enabled: true
  interval: 4
  steps: 220
  episodes: 1
  print: true

notes: "Diagnostic probe: same paper-style CS short scenario, but ownship starts slower at 270 m/s instead of 300 m/s to test whether the WEZ failure is mainly overshoot/closure."
